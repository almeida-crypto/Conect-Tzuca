<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Gavilán · dibujo</title>
<style>
body{margin:0;background:#E9DEC8;display:flex;align-items:center;justify-content:center;min-height:100vh}
svg{width:900px;height:auto;overflow:visible}
.flap #nearWing{transform-origin:288px 154px;animation:arm .62s cubic-bezier(.45,0,.55,1) infinite}
.flap #hand{transform-origin:238px 60px;animation:hand .62s cubic-bezier(.45,0,.55,1) infinite}
.flap #farWing{transform-origin:296px 152px;animation:arm .62s cubic-bezier(.45,0,.55,1) infinite}
.flap #bird{animation:bob .62s cubic-bezier(.45,0,.55,1) infinite}
@keyframes arm{0%,100%{transform:rotate(0) scaleY(1)}42%{transform:rotate(-10deg) scaleY(-.82)}}
@keyframes hand{0%,100%{transform:rotate(0)}20%{transform:rotate(12deg)}42%{transform:rotate(-6deg)}72%{transform:rotate(-22deg)}}
@keyframes far{0%,100%{transform:scaleY(1)}42%{transform:scaleY(-.45)}}
@keyframes bob{0%,100%{transform:translateY(0)}42%{transform:translateY(-10px)}}
</style></head><body>
<svg id="hawk" viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="hawk-build.js"></script>
<script>
if (/[?&]flap/.test(location.search)) document.body.classList.add('flap');
window.seek = function (ms) { document.getAnimations().forEach(function (a) { a.pause(); a.currentTime = ms; }); };
</script>
</body></html>
